[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datahub-workflow-actions"
version = "0.9.0"
description = "Generic datahub-actions action that runs declarative rules (trigger → conditions → steps) when Action Workflow requests are decided."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
dependencies = [
  "acryl-datahub>=1.0",
  "acryl-datahub-actions>=1.0",
  "pydantic>=2.5",
  "jinja2>=3.1",
  "requests>=2.31",
  "PyYAML>=6",
  "croniter>=1.4",
  "tzdata>=2023.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "responses>=0.25", "SQLAlchemy>=1.4"]
sql = ["SQLAlchemy>=1.4"]

[project.scripts]
workflow-actions = "datahub_workflow_actions.cli:main"

[project.entry-points."datahub_actions.action.plugins"]
workflow_actions = "datahub_workflow_actions.action:WorkflowActionsAction"

[project.entry-points."datahub.ingestion.source.plugins"]
datahub-workflow-actions = "datahub_workflow_actions.source:WorkflowActionsSource"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
